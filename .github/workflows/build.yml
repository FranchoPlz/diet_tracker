name: Build & Release Windows

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src-tauri/python/requirements.txt

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Install Python dependencies & PyInstaller
        run: pip install -r src-tauri/python/requirements.txt pyinstaller

      - name: Build Python sidecar
        shell: bash
        run: |
          cd src-tauri/python
          pyinstaller diet_parser.spec --distpath dist --workpath build --clean -y
          TARGET_TRIPLE="x86_64-pc-windows-msvc"
          cp dist/diet_parser.exe "../diet_parser-${TARGET_TRIPLE}.exe"
          echo "Sidecar built: src-tauri/diet_parser-${TARGET_TRIPLE}.exe"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DG Nutrición ${{ github.ref_name }}'
          releaseBody: 'Instalador de Windows para DG Nutrición.'
          releaseDraft: true
          prerelease: false
